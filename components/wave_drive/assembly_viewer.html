<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>__TITLE__</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;color:#000;font-family:'Segoe UI',Arial,sans-serif}body{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;padding:8px;gap:8px}button,select,a{color:#000}button,select{font:inherit;background:#fff;border:1px solid #000;border-radius:5px;min-height:40px;padding:7px 12px}button{cursor:pointer}button:disabled{opacity:.3;cursor:default}button:hover:not(:disabled),select:hover{background:#f1f1f1}:focus-visible{outline:3px solid #000;outline-offset:3px}#stage{min-width:0;min-height:0;border:4px solid #000;border-radius:14px;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) clamp(190px,21vw,280px);gap:12px;padding:12px;touch-action:pan-y}#stage.page,#stage.summary{grid-template-columns:minmax(0,1fr)}#stage.page{border:0;padding:0}#number{position:absolute;left:16px;top:9px;font:clamp(32px,5vh,60px)/1 Consolas,'Liberation Mono',monospace;z-index:1}#diagram{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding-top:42px}#stage.page #diagram{padding:0}#diagram img{display:block;width:100%;height:100%;object-fit:contain}#inventory{align-self:start;max-height:100%;overflow:auto;border:2px solid #000;border-radius:8px;padding:10px;display:grid;gap:14px}.part{min-width:0}.thumb{height:clamp(40px,8vh,86px);position:relative;width:max-content;margin:0 auto 5px;max-width:100%}.thumb img{height:100%;max-width:100%;object-fit:contain;display:block}.quantity{position:absolute;bottom:0;right:-9px;font-size:11px;background:#fff}.part-name{font-size:clamp(12px,1.3vw,16px);line-height:1.18;font-weight:600}.part-link{font-family:Consolas,'Liberation Mono',monospace;line-height:1.1;text-decoration:none;white-space:nowrap;font-size:11px}.part-link span{font-size:9px}.part-link b{font-weight:700}.part-link:hover{text-decoration:underline}nav{display:flex;align-items:center;justify-content:center;gap:8px;min-height:42px}nav a{font-size:12px;text-decoration:none;padding:8px}nav a:hover{text-decoration:underline}#status{min-width:76px;text-align:center;font:13px Consolas,monospace}#notice{position:fixed;bottom:65px;left:50%;transform:translateX(-50%);padding:8px 14px;background:#fff;border:1px solid #000;border-radius:6px;font-size:13px}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}[hidden]{display:none!important}@media(max-width:620px) and (orientation:portrait){body{padding:5px;gap:5px}#stage{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:5px;padding:8px;border-width:3px}#stage.page,#stage.summary{grid-template-rows:1fr}#inventory{max-height:34dvh;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px}.thumb{height:40px}.part-name{font-size:12px}.part-link{font-size:11px}#number{font-size:32px;left:10px;top:8px}#diagram{padding-top:34px}nav{gap:4px;flex-wrap:wrap}nav button,nav select{padding:5px 8px;min-height:36px;font-size:12px}#status{min-width:50px;font-size:11px}nav a{font-size:11px;padding:4px}}@media(max-height:500px) and (orientation:landscape){#stage{padding:7px;gap:7px;grid-template-columns:minmax(0,1fr) 190px}#inventory{gap:5px;padding:6px}.thumb{height:28px;margin-bottom:2px}.part-name{font-size:11px}.part-link{font-size:10px}#number{font-size:30px}#diagram{padding-top:30px}nav{min-height:32px}nav button,nav select{min-height:30px;padding:4px 9px}}@media(prefers-reduced-motion:no-preference){#diagram img{animation:appear .12s ease-out}@keyframes appear{from{opacity:.5}to{opacity:1}}}
</style>
</head>
<body>
<main id="stage" aria-label="Assembly instruction"><div id="number" aria-hidden="true"></div><div id="diagram"><img id="scene" alt=""></div><aside id="inventory" aria-label="Parts needed"></aside><p id="description" class="sr"></p></main>
<nav aria-label="Instruction navigation"><button id="previous" aria-label="Previous instruction" title="Previous (Left arrow)">&#8592;</button><select id="jump" aria-label="Go to instruction"></select><span id="status" role="status" aria-live="polite"></span><button id="next" aria-label="Next instruction" title="Next (Right arrow)">&#8594;</button><button id="fullscreen" title="Toggle full screen (F)">Full screen</button><a href="__PROJECT_URL__" target="_blank" rel="noopener noreferrer">GitHub</a></nav>
<div id="notice" role="status" hidden></div><noscript>Enable JavaScript to use the instruction viewer.</noscript>
<script id="viewer-data" type="application/json">__DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('viewer-data').textContent);
const stage=document.getElementById('stage'), scene=document.getElementById('scene'), inventory=document.getElementById('inventory'), number=document.getElementById('number'), jump=document.getElementById('jump'), previous=document.getElementById('previous'), next=document.getElementById('next'), status=document.getElementById('status'), fullscreen=document.getElementById('fullscreen');
let current=0, startX=null, startY=null;
for(const slide of data.slides){const option=document.createElement('option');option.value=slide.id;option.textContent=slide.label;jump.append(option);}
function show(index,updateHash=true){
 current=Math.max(0,Math.min(data.slides.length-1,index));const slide=data.slides[current];
 stage.className=slide.mode==='page'?'page':Object.keys(slide.parts).length?'':'summary';
 number.hidden=slide.mode==='page';number.textContent=slide.number||'';
 scene.src=data.images[slide.image];scene.alt=slide.mode==='step'?slide.label+': '+slide.description:slide.label;
 document.getElementById('description').textContent=slide.description||slide.label;
 inventory.replaceChildren();
 for(const [key,count] of Object.entries(slide.parts||{})){
  const part=data.parts[key],card=document.createElement('div'),thumb=document.createElement('div'),img=document.createElement('img'),name=document.createElement('div');
  card.className='part';thumb.className='thumb';img.src=data.images['part_'+key];img.alt='';thumb.append(img);
  if(count>1){const q=document.createElement('span');q.className='quantity';q.textContent='x'+count;thumb.append(q);}
  name.className='part-name';name.textContent=part.name;card.append(thumb,name);
  if(part.short_url){const link=document.createElement('a'),prefix=document.createElement('span'),code=document.createElement('b');link.className='part-link';link.href=part.short_url;link.target='_blank';link.rel='noopener noreferrer';prefix.textContent='oom.lt/a/';code.textContent=part.md5_6_alpha;link.append(prefix,code);card.append(link);}
  inventory.append(card);
 }
 inventory.hidden=!inventory.children.length;inventory.scrollTop=0;jump.value=slide.id;
 status.textContent=slide.number?slide.number+' / '+data.slides.filter(s=>s.mode==='step').length:slide.label;
 previous.disabled=current===0;next.disabled=current===data.slides.length-1;
 if(updateHash&&location.hash!=='#'+slide.id)location.hash=slide.id;
}
function fromHash(){let index=data.slides.findIndex(s=>s.id===location.hash.slice(1));if(index<0)index=data.slides.findIndex(s=>s.id===data.start);show(Math.max(0,index),false);}
previous.onclick=()=>show(current-1);next.onclick=()=>show(current+1);jump.onchange=()=>show(data.slides.findIndex(s=>s.id===jump.value));window.addEventListener('hashchange',fromHash);
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw Error('unsupported');}catch(error){const notice=document.getElementById('notice');notice.textContent='Use your browser’s full-screen control.';notice.hidden=false;setTimeout(()=>notice.hidden=true,3500);}}
fullscreen.onclick=full;document.addEventListener('fullscreenchange',()=>fullscreen.textContent=document.fullscreenElement?'Exit full screen':'Full screen');
document.addEventListener('keydown',event=>{if(event.target.tagName==='SELECT'||event.ctrlKey||event.metaKey||event.altKey)return;if(['ArrowRight','PageDown'].includes(event.key)||(event.key===' '&&event.target.tagName!=='BUTTON')){event.preventDefault();show(current+1);}else if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();show(current-1);}else if(event.key==='Home'){event.preventDefault();show(0);}else if(event.key==='End'){event.preventDefault();show(data.slides.length-1);}else if(event.key.toLowerCase()==='f')full();});
stage.addEventListener('pointerdown',event=>{if(event.target.closest('a'))return;startX=event.clientX;startY=event.clientY;});
stage.addEventListener('pointerup',event=>{if(startX===null)return;const dx=event.clientX-startX,dy=event.clientY-startY;startX=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4)show(current+(dx<0?1:-1));});
stage.addEventListener('pointercancel',()=>startX=null);
fromHash();
</script>
</body>
</html>
