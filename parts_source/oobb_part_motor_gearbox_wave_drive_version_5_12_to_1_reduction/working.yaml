assembly_steps:
- Load six M3 nuts from below the plate. Seat the plate on the motor pilot and install
  four M3 x {motor_screw_length} countersunk screws with heads {countersunk_head_proud:g}
  mm proud of its top face.
- Seat twelve M2 nuts underneath the lower cage, then lower the cage teeth upward
  onto the plate.
- Load two M3 joint nuts from below. Slide the lower eccentric onto the motor shaft
  with its semicircular alignment tongue upward.
- Seat four M3 nuts underneath the lower clamshell. Lower it around the eccentric
  journal and seat the 6704 bearing squarely in its recess.
- Load the radial M3 nut from the top of the upper eccentric and start its M3 x {shaft_clamp_screw_length}
  clamp screw. Match the semicircular key and recess at the middle of the bearing.
  Tighten the two M3 x {eccentric_join_screw_length} countersunk joiners, then tighten
  the upper shaft clamp before fitting the outer case.
- Fit the upper wave half around the 6704 bearing. Tighten four M3 x {wave_screw_length}
  countersunk screws into the lower nuts.
- Confirm the upper shaft clamp is tight, then lower the fixed ring around the cage
  and align all six fins with the base.
- At input angle zero, insert one {roller_diameter:g} mm OD x {roller_length:g} mm
  nylon spacer in each cage slot.
- Load four M3 output nuts underneath the upper cage, then lower it over the teeth.
  Install all twelve M2 x {cage_screw_length} countersunk screws through the disc
  into the lower cage nuts.
- Seat the 6810 over the upper cage hub. Lower the housing over the bearing outer
  race. Insert six M3 x {case_screw_length} socket caps from the top and tighten into
  the captive base nuts.
- Load {output_m3_mount_count} M3 attachment nuts into the carrier and two M3 sandwich
  nuts from underneath. Fit the flat cover and tighten two M3 x {output_plate_clamp_screw_length}
  countersunk screws. The plate is now clamped as a separate assembly; its viewing
  hole and bolt-clearance holes stay open.
- Lower the preassembled output plate over the bearing and fasten it to the cage with
  four M3 x {output_screw_length} countersunk screws. Keep the separate short sandwich
  screws tight. With power disconnected, hand-turn the input {reduction} times for
  one reverse output turn and observe the shaft through the {output_view_diameter:g}
  mm opening.
