assembly_steps:
- Print the fit coupons. Check the 6810 seat, 6704 seat, motor D shaft, roller windows
  and OOBB nut pockets before the full build.
- Mount the {motor_body_depth:g} mm NEMA 17 to the {base_width} x {base_height} OOBB
  plate with four M3 x {motor_screw_length} socket caps. Confirm {motor_thread_engagement:g}
  mm engagement fits the actual motor threads.
- Preload the {cage_screw_count} M2 x {cage_screw_length} cage screws into the lower
  cap before fitting it around the shaft. Align their heads with the hex-key access
  holes in the motor plate.
- Load the eccentric nut and fit the eccentric at Z={cam_base_z:g} mm above the motor
  face. Tighten its M3 x 8 grub onto the shaft flat while the ring and rollers are
  absent.
- Load four M3 nuts in the wave wheel, seat the 6704, and lower the wheel over the
  eccentric journal. Fit the upper eccentric collar and tighten its grub onto the
  flat with the intended bearing clearance.
- Close the wave bearing cap with four M3 x {wave_screw_length} socket caps. Lower
  the fixed ring over the mechanism and align the housing holes.
- At input angle zero, the eccentric points along +X. Insert all {roller_count} nylon
  spacers axially, then lower the cage over them with its fingers downward. Preload
  its output nuts and fit the cage nuts in their top pockets.
- Tighten the cage screws through the motor-plate access holes with an L hex key.
  Keep the key clear of the motor cable/connector.
- Load the five M6 output nuts into the output hub and place the hub above the cage.
  Its central blind recess clears the motor shaft tip by {motor_shaft_end_clearance:g}
  mm. Fit the single 6810 around the hub.
- Fit the upper bearing housing with its mouth downward. Install the {housing_screw_count}
  M3 x {case_screw_length} case caps and nuts. The fixed ring and upper housing retain
  the bearing outer race.
- Fit the full-face output plate and its four M3 x {output_screw_length} socket caps.
  Its five M6 attachment holes lie on a {output_grid_pitch:g} mm OOBB grid; the corner
  M3 holes retain the plate. Use the generated attachment-depth limits when choosing
  payload bolts.
- Turn the input slowly by hand and check one reverse output turn per {reduction}
  input turns. Physical fit, motor bearing loads, vibration and printed strength remain
  untested.
